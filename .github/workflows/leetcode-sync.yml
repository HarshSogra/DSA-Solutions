name: Sync LeetCode Solutions

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, avoiding the busiest minute of the hour.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync accepted LeetCode submissions
        env:
          LEETCODE_USERNAME: ${{ vars.LEETCODE_USERNAME }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_CF_CLEARANCE: ${{ secrets.LEETCODE_CF_CLEARANCE }}
        run: python scripts/leetcode_sync.py

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No new accepted LeetCode submissions."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: sync accepted LeetCode solutions"
          git push
